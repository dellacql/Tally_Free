[package]
name = "ul-keystore"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
rand = "0.8"
argon2 = { version = "0.5", features = ["std"] }                  
chacha20poly1305 = { version = "0.10", features = ["std"] }
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
ul_crypto = { package = "ul-crypto", path = "../ul-crypto" }  