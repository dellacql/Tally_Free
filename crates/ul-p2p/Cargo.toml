[package]
name = "ul-p2p"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
libp2p = { version = "0.54", features = [
  "tokio","gossipsub","kad","identify","autonat","dcutr","macros"
] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
tracing = "0.1"
ul_types = { package = "ul-types", path = "../ul-types" }
