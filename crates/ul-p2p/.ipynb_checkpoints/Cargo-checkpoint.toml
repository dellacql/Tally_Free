[package]
name = "ul-p2p"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bincode = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

libp2p = { version = "0.54", features = [
    "tokio",
    "quic",
    "gossipsub",
    "kad",
    "identify",
    "autonat",
    "dcutr",
    "macros"
] }

ul_types = { package = "ul-types", path = "../ul-types" }