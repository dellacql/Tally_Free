[package]
name = "ul-ledger"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
sled = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
blake3 = "1"
hex = "0.4"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
rand = "0.8"
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
ul_types = { package = "ul-types", path = "../ul-types" }
