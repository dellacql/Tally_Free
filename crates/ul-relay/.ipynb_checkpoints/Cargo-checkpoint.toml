[package]
name = "ul-relay"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bincode = "1"
clap = { version = "4.5", features = ["derive"] }
libp2p = { version = "0.54", features = [
    "tokio",
    "quic",
    "relay",
    "identify",
    "gossipsub",
    "macros"
] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

ul_p2p = { package = "ul-p2p", path = "../ul-p2p" }

