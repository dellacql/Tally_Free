[package]
name = "ul-crypto"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
rand = "0.8"
blake3 = "1"
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["std"] }
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
ul_types = { package = "ul-types", path = "../ul-types" }
