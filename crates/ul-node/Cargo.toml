[package]
name = "ul-node"
version = "0.1.0"
edition = "2024"

[dependencies]
ul_types     = { package = "ul-types", path = "../ul-types" }
ul_crypto    = { package = "ul-crypto", path = "../ul-crypto" }
ul_keystore  = { package = "ul-keystore", path = "../ul-keystore" }
ul_state     = { package = "ul-state", path = "../ul-state" }
ul_consensus = { package = "ul-consensus", path = "../ul-consensus" }
ul_p2p       = { package = "ul-p2p", path = "../ul-p2p" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
libp2p = "0.54"
ul-keystore = { package = "ul-keystore", path = "../ul-keystore" }
ul-p2p = { package = "ul-p2p", path = "../ul-p2p" }
ed25519-dalek = "2"
serde_json = "1"
sled = "0.34"
blake3 = "1"
num-bigint = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
rpassword = "7"