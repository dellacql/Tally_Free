[package]
name = "ul-node"
version = "0.1.0"
edition = "2024"

[dependencies]
ul_types = { package = "ul-types", path = "../ul-types" }
ul_crypto = { package = "ul-crypto", path = "../ul-crypto" }
ul_keystore = { package = "ul-keystore", path = "../ul-keystore" }
ul_consensus = { package = "ul-consensus", path = "../ul-consensus" }
ul_p2p = { package = "ul-p2p", path = "../ul-p2p" }
ul_ledger = { package = "ul-ledger", path = "../ul-ledger" }

anyhow = "1"
bincode = "1.3"
blake3 = "1"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2"
hex = "0.4"
libp2p = "0.54"
num-bigint = "0.4"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sled = "0.34"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }